# Butterfly 主题配置
# 完整配置说明: https://butterfly.js.org/posts/4aa8abbe/
# 默认配置参考: node_modules/hexo-theme-butterfly/_config.yml
# 这里只覆盖需要自定义的项, 其余使用主题默认值

# ===== 图片相关 =====
# 用法: 把图片放到 source/img/ 目录, 填 /img/文件名; 也可以直接填网络图片 URL
# 留空 = 使用主题默认图

# 首页顶部大图 (刚进页面看到的那张)
index_img: /img/banner.jpg

# 文章页顶部默认大图 (文章没单独设置 top_img 时用这张)
# top_img: /img/banner.jpg

# 头像 (侧边栏圆形头像)
avatar:
  img: /img/avatar.jpeg

# ===== 标题字体 =====
# Righteous: 科技感英文字体, 应用于首页大标题 / 导航栏标题 / 侧边栏作者名
# font_link 使用 Google Fonts 国内镜像, 如需官方源改为 https://fonts.googleapis.com/css2?family=Righteous&display=swap
blog_title_font:
  font_link: https://fonts.googleapis.cn/css2?family=Righteous&display=swap
  font_family: Righteous, 'PingFang SC', 'Microsoft YaHei', sans-serif

# ===== 自定义文件注入 =====
# custom.css: 打字机光标样式; title-typewriter.js: 首页大标题打字机效果
inject:
  head:
    - <link rel="stylesheet" href="/css/custom.css">
  bottom:
    - <script src="/js/title-typewriter.js"></script>

# 导航栏
nav:
  logo: # 站点 Logo 图片路径, 例如 /img/logo.png
  display_title: true
  fixed: false

# 菜单 (只保留已存在的页面, 后续新增页面时再补充)
menu:
  首页: / || fas fa-home
  时间轴: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  # 关于: /about/ || fas fa-heart
  # 友链: /link/ || fas fa-link

# 代码块
highlight_theme: mac light
copy:
  enable: true

# 首页文章摘要自动截取长度
auto_excerpt:
  enable: true
  length: 200

# 侧边栏
side:
  enable: true
  position: right

# 页脚
footer:
  owner:
    enable: true
    since: 2026
  custom_text: # 自定义页脚文字, 例如备案号
  copyright: true

# 图片懒加载
lazyload:
  enable: true
  field: post

# 暗黑模式设置
darkmode:
  # 是否启用暗黑模式
  enable: true
  # 切换暗黑/明亮模式的按钮
  button: true
  # 是否自动切换暗黑/明亮模式
  # autoChangeMode: 1  #跟随系统设置，如果系统不支持暗黑模式，则在晚上 6 点到早上 6 点之间切换暗黑模式
  autoChangeMode: 2  #在晚上 6 点到早上 6 点之间切换暗黑模式
  # autoChangeMode: false  不自动切换
  # autoChangeMode: false
  # 设置明亮模式时间，值在 0 到 24 之间。如果未设置，默认值为 6 和 18
  # start:
  # end:

# ===== 主题色: 黑色系 =====
# 把默认的蓝色 (#49B1F5) 换成近黑色 (#1c1c1e)
# 注意: 颜色值必须用双引号包起来, 否则构建报错
# 想要纯黑可把 #1c1c1e 全部换成 #000000
theme_color:
  enable: true
  main: "#1c1c1e"                    # 主色 (按钮/链接高亮/选中等)
  paginator: "#1c1c1e"               # 分页器
  button_hover: "#48484a"            # 按钮悬停 (深灰, 与主色区分)
  text_selection: "#3a3a3c"          # 文字选中背景
  link_color: "#49494b"              # 正文链接颜色
  meta_color: "#858585"              # 文章元信息 (日期等)
  hr_color: "#bfbfc4"                # 分割线
  code_foreground: "#f47466"         # 行内代码文字 (保留红色点缀)
  code_background: "rgba(27, 31, 35, .05)"  # 行内代码背景
  toc_color: "#1c1c1e"               # 目录选中项
  blockquote_padding_color: "#1c1c1e"      # 引用块左侧竖线
  blockquote_background_color: "#1c1c1e"   # 引用块背景 (自动加 10% 透明度)
  scrollbar_color: "#1c1c1e"         # 滚动条
  meta_theme_color_light: "#ffffff"  # 浏览器状态栏 (亮色模式)
  meta_theme_color_dark: "#0d0d0d"   # 浏览器状态栏 (暗色模式)
